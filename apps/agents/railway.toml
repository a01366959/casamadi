# Railway config for @casamadi/agents
# Service root: . (repo root)
# This ensures pnpm-lock.yaml is available

[nixpacks]
providers = ["node"]

[[nixpacks.pkgs]]
pkgName = "pnpm"

[build]
# Install all deps and build the agent
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @casamadi/agents build"

[start]
# Start the agent from dist
runCommand = "node apps/agents/dist/index.js"
