# Railway config for @casamadi/agents
# Service root: apps/agents
# This service is part of a monorepo - need to build from repo root

[nixpacks]
providers = ["node"]

[[nixpacks.pkgs]]
pkgName = "pnpm"

[build]
# Go to monorepo root, install, and build
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @casamadi/agents build"

[start]
# Run the compiled agent
runCommand = "node dist/index.js"
